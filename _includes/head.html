<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  {% assign page_description = page.description | default: site.description | strip_html | normalize_whitespace %}
  {% capture page_title %}{{ page.title }} | {{ site.title }}{% endcapture %}
  <title>{{ page_title | escape }}</title>
  <meta name="description" content="{{ page_description | escape }}" />
  <meta name="author" content="{{ site.author.name | escape }}" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="{{ site.locale | escape }}" />
  <meta property="og:site_name" content="{{ site.title | escape }}" />
  <meta property="og:title" content="{{ page_title | escape }}" />
  <meta property="og:description" content="{{ page_description | escape }}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="{{ page_title | escape }}" />
  <meta name="twitter:description" content="{{ page_description | escape }}" />
  <link rel="icon" type="image/png" href="{{ '/src/images/file-code-solid.png' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/src/css/bootstrap.min.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/src/css/style.css' | relative_url }}" />
</head>
